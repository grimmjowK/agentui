<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>EAO</title>
  <style>
    /* 跟随 nativeTheme.themeSource（main 在建窗前已设为上次主题，首次启动为系统主题） */
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #020817; --muted: #e5e7eb; --accent: #2563eb;
      --detail-bg: #f8fafc; --detail-border: #e5e7eb; --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020817; --fg: #e5e7eb; --muted: #374151; --accent: #60a5fa;
        --detail-bg: #0b1220; --detail-border: #1f2937; --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--fg); -webkit-user-select: none; user-select: none;
    }
    /* 隐藏系统标题栏后的拖拽条，高度与 src/index.css 的 --titlebar-height 对齐 */
    html[data-desktop] body::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0; height: 38px; -webkit-app-region: drag;
    }
    html[data-desktop="win32"] body::before { height: 36px; }
    html[data-fullscreen] body::before { display: none; }
    main { width: min(560px, 90vw); text-align: center; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 20px; border-radius: 50%;
      border: 2px solid var(--muted); border-top-color: var(--accent); animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .detail {
      display: none; margin-top: 16px; padding: 12px; max-height: 40vh; overflow: auto;
      background: var(--detail-bg); border: 1px solid var(--detail-border); border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
      white-space: pre-wrap; text-align: left; color: var(--error); user-select: text;
    }
    button {
      margin-top: 20px; padding: 8px 20px; border: 0; border-radius: 6px;
      background: #2563eb; color: #fff; font-size: 14px; cursor: default;
    }
    button:hover { background: #1d4ed8; }
    button[hidden] { display: none; }
    body.error .spinner { display: none; }
    body.error h1 { color: var(--error); }
    body.error .detail { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="spinner" id="spinner"></div>
    <h1 id="message">正在启动后端服务…</h1>
    <pre class="detail" id="detail"></pre>
    <button id="retry" hidden>重试</button>
  </main>
  <script>
    const el = { message: document.getElementById('message'), detail: document.getElementById('detail'), retry: document.getElementById('retry') };

    function render(state) {
      if (!state) return;
      document.body.classList.toggle('error', state.phase === 'error');
      el.message.textContent = state.message || '';
      el.detail.textContent = state.detail || '';
      el.retry.hidden = state.phase !== 'error';
    }

    // preload 未注入时（加载失败）也不该白屏：退化成静态文案，只是没有重试按钮
    if (window.cloudcliDesktop) {
      window.cloudcliDesktop.getStartupState().then(render);
      window.cloudcliDesktop.onStartupState(render);
      el.retry.addEventListener('click', () => {
        render({ phase: 'loading', message: '正在重启后端服务…' });
        window.cloudcliDesktop.retry();
      });
    } else {
      el.message.textContent = '桌面外壳初始化失败（preload 未加载）';
      document.body.classList.add('error');
      el.detail.textContent = '请退出应用后重新启动。';
    }
  </script>
</body>
</html>
