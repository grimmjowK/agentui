[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popo-oapi-sdk"
version = "1.0.0"
description = "POPO 开放平台 Python SDK - 基于 STOMP over WebSocket 的长链接事件接收"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "websocket-client>=1.6.0",
    "requests>=2.28.0",
    "pycryptodome>=3.18.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "mypy"]

[tool.setuptools.packages.find]
include = ["popo_sdk*"]
